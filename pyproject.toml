[project]
name = "glance-deck-home-assistant"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "homeassistant==2025.2.5",
  "pytest==8.3.5",
  "pytest-asyncio==0.25.3",
  "pytest-cov==6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=custom_components.glance_deck --cov-report=term-missing --cov-fail-under=90"
